name: Catalog database migration tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  catalog-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bzaudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bzaudio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bzaudio_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create Supabase role stand-ins
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL

      - name: Apply catalog migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118232000_create_physical_equipment_catalog.sql

      - name: Verify row security and least-privilege access
        run: psql -v ON_ERROR_STOP=1 -f tests/catalog-rls.test.sql
